<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Xiaomi HyperOS 2.0</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <!-- Xiaomi Splash Screen -->
    <div id="xiaomiSplash" class="xiaomi-splash">
        <div class="xiaomi-logo">
            <svg viewBox="0 0 100 100" class="mi-logo">
                <rect x="10" y="10" width="35" height="35" rx="8" fill="#FF6900"/>
                <rect x="55" y="10" width="35" height="35" rx="8" fill="#FF6900"/>
                <rect x="10" y="55" width="35" height="35" rx="8" fill="#FF6900"/>
                <rect x="55" y="55" width="35" height="35" rx="8" fill="#FF6900"/>
            </svg>
        </div>
        <div class="xiaomi-text">xiaomi</div>
        <div class="xiaomi-tagline">HyperOS 2.0</div>
    </div>

    <!-- Xiaomi Background Orbs -->
    <div class="xiaomi-orb orange-1"></div>
    <div class="xiaomi-orb orange-2"></div>
    <div class="xiaomi-orb orange-3"></div>

    <!-- Phone Frame -->
    <div class="phone-frame">
        <!-- Phone Notch -->
        <div class="phone-notch">
            <div class="notch-camera"></div>
        </div>
        
        <!-- Phone Screen -->
        <div class="phone-screen">
            <!-- Status Bar -->
            <div class="xiaomi-status-bar">
                <div class="status-left">
                    <span class="mi-brand-small">MI</span>
                </div>
                <div class="status-right">
                    <span class="time" id="statusTime">12:00</span>
                    <span class="status-icon">📶</span>
                    <span class="status-icon">🔋</span>
                </div>
            </div>

            <!-- Main Content -->
            <div class="xiaomi-grid">
            <button class="xiaomi-btn" id="btt">
                <span class="btn-icon">🎨</span>
                <span class="btn-text">Figma 1</span>
            </button>
            <button class="xiaomi-btn" id="btt1">
                <span class="btn-icon">🎭</span>
                <span class="btn-text">Figma 2</span>
            </button>
            <button class="xiaomi-btn" id="btt2">
                <span class="btn-icon">🎯</span>
                <span class="btn-text">Figma 3</span>
            </button>
            <button class="xiaomi-btn" id="btt3">
                <span class="btn-icon">🍎</span>
                <span class="btn-text">iOS 26</span>
            </button>
            <button class="xiaomi-btn" id="btt4">
                <span class="btn-icon">📱</span>
                <span class="btn-text">Samsung</span>
            </button>
            <button class="xiaomi-btn" id="btt5">
                <span class="btn-icon">⚡</span>
                <span class="btn-text">HyperOS</span>
            </button>
            </div>
            
            <!-- Home Indicator -->
            <div class="xiaomi-home-indicator"></div>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
