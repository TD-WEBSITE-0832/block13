<!DOCTYPE html>
<html lang="uz">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Tab Index Switcher</title>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=DM+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    font-family: 'DM Sans', sans-serif;
    background: #3b8abf;
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
  }

  .card {
    background: #ffffff;
    border-radius: 16px;
    padding: 32px;
    width: 500px;
    box-shadow: 0 20px 60px rgba(0,0,0,0.2);
  }

  .input-row {
    display: flex;
    gap: 12px;
    align-items: flex-end;
    margin-bottom: 28px;
  }

  .input-wrapper {
    flex: 1;
    position: relative;
  }

  .input-wrapper label {
    display: block;
    font-size: 13px;
    color: #b0bec5;
    margin-bottom: 6px;
    font-weight: 500;
  }

  .tab-input {
    width: 100%;
    border: none;
    border-bottom: 2px solid #e0e0e0;
    outline: none;
    font-size: 18px;
    font-family: 'DM Mono', monospace;
    color: #1a1a2e;
    padding: 8px 32px 8px 0;
    background: transparent;
    transition: border-color 0.2s;
  }

  .tab-input:focus { border-bottom-color: #3b8abf; }

  .spinner-btns {
    position: absolute;
    right: 0;
    top: 50%;
    transform: translateY(-20%);
    display: flex;
    flex-direction: column;
    gap: 2px;
  }

  .spinner-btns button {
    background: none;
    border: none;
    cursor: pointer;
    color: #b0bec5;
    font-size: 12px;
    padding: 1px 4px;
  }

  .spinner-btns button:hover { color: #1a1a2e; }

  .change-btn {
    background: #1a1a2e;
    color: #fff;
    border: none;
    border-radius: 10px;
    padding: 12px 22px;
    font-family: 'DM Sans', sans-serif;
    font-size: 15px;
    font-weight: 600;
    cursor: pointer;
    white-space: nowrap;
  }

  .change-btn:hover { background: #2d2d44; }

  .tabs {
    display: flex;
    border-bottom: 2px solid #e0e0e0;
    margin-bottom: 24px;
  }

  .tab-btn {
    background: none;
    border: none;
    font-family: 'DM Sans', sans-serif;
    font-size: 13px;
    font-weight: 600;
    letter-spacing: 1.2px;
    text-transform: uppercase;
    padding: 10px 18px;
    cursor: pointer;
    color: #b0bec5;
    position: relative;
    transition: color 0.2s;
  }

  .tab-btn::after {
    content: '';
    position: absolute;
    bottom: -2px;
    left: 0;
    width: 100%;
    height: 2px;
    background: #1a1a2e;
    transform: scaleX(0);
    transition: transform 0.25s;
  }

  .tab-btn.active { color: #1a1a2e; }
  .tab-btn.active::after { transform: scaleX(1); }

  .tab-content {
    display: none;
    font-size: 16px;
    min-height: 40px;
    line-height: 1.6;
    animation: fadeIn 0.2s ease;
  }

  .tab-content.active { display: block; }

  @keyframes fadeIn {
    from { opacity: 0; transform: translateY(5px); }
    to   { opacity: 1; transform: translateY(0); }
  }

  #content-positive { color: #2e7d32; }
  #content-negative { color: #c62828; }
  #content-neutral  { color: #546e7a; }
</style>
</head>
<body>

<div class="card">
  <div class="input-row">
    <div class="input-wrapper">
      <label>Enter tab index</label>
      <input type="number" id="tabInput" class="tab-input" placeholder="0" />
      <div class="spinner-btns">
        <button onclick="changeVal(1)">▲</button>
        <button onclick="changeVal(-1)">▼</button>
      </div>
    </div>
    <button class="change-btn" onclick="changeTab()">Change tab</button>
  </div>

  <div class="tabs">
    <button class="tab-btn" id="tab-positive" onclick="switchTab('positive')">Positive</button>
    <button class="tab-btn" id="tab-negative" onclick="switchTab('negative')">Negative</button>
    <button class="tab-btn active" id="tab-neutral"  onclick="switchTab('neutral')">Neutral</button>
  </div>

  <div class="tab-content" id="content-positive">✅ Positive — Son 0 dan <strong>katta</strong>.</div>
  <div class="tab-content" id="content-negative">❌ Negative — Son 0 dan <strong>kichik</strong>.</div>
  <div class="tab-content active" id="content-neutral">Neutral content</div>
</div>

<script>
  function changeVal(dir) {
    var input = document.getElementById('tabInput');
    var val = parseInt(input.value);
    if (isNaN(val)) val = 0;
    input.value = val + dir;
  }

  function changeTab() {
    var val = parseInt(document.getElementById('tabInput').value);
    if (isNaN(val) || val === 0) {
      switchTab('neutral');
    } else if (val > 0) {
      switchTab('positive');
    } else {
      switchTab('negative');
    }
  }

  function switchTab(name) {
    ['positive', 'negative', 'neutral'].forEach(function(t) {
      document.getElementById('tab-' + t).classList.remove('active');
      document.getElementById('content-' + t).classList.remove('active');
    });
    document.getElementById('tab-' + name).classList.add('active');
    document.getElementById('content-' + name).classList.add('active');
  }

  document.getElementById('tabInput').addEventListener('keydown', function(e) {
    if (e.key === 'Enter') changeTab();
  });
</script>
</body>
</html>
